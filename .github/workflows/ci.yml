name: CI

on:
  push:
    branches: [main, develop, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vinfast
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: autoquote_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinfast -d autoquote_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-for-isolated-test-database
      DATABASE_URL: postgresql+asyncpg://vinfast:ci-test-password@localhost:5432/autoquote_ci_test
      MIGRATION_DATABASE_URL: postgresql://vinfast:ci-test-password@localhost:5432/autoquote_ci_test
      BUSINESS_TEST_DATABASE_URL: postgresql+asyncpg://vinfast:ci-test-password@localhost:5432/autoquote_ci_test
      AI_TEST_DATABASE_URL: postgresql://vinfast:ci-test-password@localhost:5432/autoquote_ci_test
      OPENAI_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Unicode PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Prepare isolated PostgreSQL database
        run: python scripts/db/migrate_supabase.py bootstrap --seed

      - name: Run unit and PostgreSQL integration tests
        run: pytest tests/ -v --tb=short

      - name: Build production image with embedded Zalo runtime
        run: docker build -t autoquote-production-ci .

      - name: Smoke test production startup without new Zalo settings
        run: |
          docker run -d --name autoquote-production-ci --network host \
            -e APP_ENV=production -e JWT_SECRET -e DATABASE_URL -e OPENAI_API_KEY \
            -e PORT=18000 autoquote-production-ci
          trap 'docker logs autoquote-production-ci; docker stop -t 25 autoquote-production-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health
          docker exec autoquote-production-ci python -c '
          import json, os, sys
          from urllib.request import Request, urlopen
          sys.path.insert(0, "/app/scripts")
          from start_services import embedded_environment
          env, embedded = embedded_environment(os.environ)
          assert embedded
          request = Request(env["ZALO_BRIDGE_URL"] + "/accounts/00000000-0000-0000-0000-000000000000", headers={"Authorization": "Bearer " + env["ZALO_BRIDGE_TOKEN"]})
          with urlopen(request) as response:
              assert json.load(response)["status"] == "disconnected"
          print("Production API and private Zalo bridge are ready; no QR or messages created.")'

  zalo-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: zalo-bridge/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: zalo-bridge
      - run: npm test
        working-directory: zalo-bridge

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
