services:
  - type: web
    name: vinfast-ai-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AutoQuote AI
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: GOOGLE_MODEL_NAME
        sync: false
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
